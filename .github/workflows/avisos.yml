# Avisos de precio por correo de ¿Cuál me conviene?
# Después de cada actualización de precios lo lanza "Fotos y fichas" (sitio.yml) con esperar=true: espera a que Cloudflare publique
# la página nueva y llama a /api/revisar-avisos. Esa función compara los precios, arma los avisos de quienes
# siguen un equipo y el resumen diario, y envía los correos de a 25 por llamada.
# Si no hubo cambios de precios, la función no hace nada (es seguro llamarla de más).
name: Avisos de precio
on:
  # Antes se usaba workflow_run, pero GitHub no lo dispara cuando "Fotos y fichas" fue lanzado por otro flujo
  # (vueltas de precios cada 2 horas): el 17-11-2026 el resumen no salió por eso. Ahora sitio.yml lo lanza directo.
  schedule:
    - cron: '2 13 * * *'    # 10:02 de Chile (verano): sale el resumen diario a los suscritos (no sale antes de las 10:00)
    - cron: '20 14 * * *'   # respaldo a las 11:20 de Chile (GitHub a veces atrasa los horarios)
    - cron: '40 16 * * *'   # respaldo a las 13:40 de Chile
  workflow_dispatch:
    inputs:
      esperar:
        description: 'Esperar a que Cloudflare publique los precios nuevos (lo usa Fotos y fichas)'
        type: boolean
        default: false
permissions: {}
concurrency:
  group: avisos
  cancel-in-progress: false
jobs:
  avisos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Esperar a que Cloudflare publique los precios nuevos
        if: inputs.esperar
        run: sleep 210
      - name: Revisar avisos y enviar correos
        run: |
          for i in $(seq 1 40); do
            r=$(curl -sS -X POST --max-time 60 -H 'Content-Type: application/json' -H 'User-Agent: cualmeconviene-avisos/1.0' \
                https://cualmeconviene.cl/api/revisar-avisos || echo '{}')
            echo "$r"
            [ "$(echo "$r" | jq -r '.seguir // false' 2>/dev/null)" = "true" ] || break
            sleep 2
          done
