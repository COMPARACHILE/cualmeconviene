# Descarga y optimiza las fotos de productos cuando cambia herramientas/fotos.json.
# Las deja en assets/p/<id>.webp y las guarda en la misma rama (Cloudflare publica solo).
name: Fotos de productos
on:
  workflow_dispatch:
  push:
    paths:
      - 'herramientas/fotos.json'
      - 'herramientas/fotos.py'
      - '.github/workflows/fotos.yml'
permissions:
  contents: write
concurrency:
  group: fotos-${{ github.ref }}
  cancel-in-progress: false
jobs:
  fotos:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python herramientas/fotos.py descargar
      - name: Guardar las fotos en el repositorio
        run: |
          git config user.name "fotos-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/p herramientas/fotos-log.txt
          if git diff --cached --quiet; then echo "Sin fotos nuevas"; exit 0; fi
          git commit -m "Fotos de productos (automático)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
