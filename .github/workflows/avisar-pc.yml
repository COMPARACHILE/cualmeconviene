# Rama lecturas-pc: aquí el PC del dueño sube cada 2 horas pc/<dd-mm-aaaa>-<HH>h/ (tiendas que bloquean a GitHub).
# Al llegar informe.json, lanza la vuelta completa de "Precios diarios" en main: lee también las tiendas de GitHub,
# suma esta lectura, aplica y publica una sola vez (17-11-2026).
name: Avisar lectura del PC
on:
  push:
    branches: [lecturas-pc]
    paths: ['pc/**/informe.json']
permissions:
  actions: write
jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - run: gh workflow run precios-diarios.yml --repo ${{ github.repository }} --ref main
        env:
          GH_TOKEN: ${{ github.token }}
