# Tareas automáticas de ¿Cuál me conviene? cada vez que cambian los precios o la lista de fotos:
# 1) baja y optimiza las fotos nuevas (assets/p/<id>.webp)
# 2) rehace la ficha de cada equipo con su historial de precios, el sitemap y assets/fichas.js
# Guarda el resultado en la misma rama y Cloudflare lo publica solo.
name: Fotos y fichas
on:
  workflow_dispatch:
  push:
    paths:
      - 'notebooks.html'
      - 'celulares.html'
      - 'tablets.html'
      - 'televisores.html'
      - 'herramientas/fotos.json'
      - 'herramientas/fotos.py'
      - 'herramientas/fichas.py'
      - 'herramientas/precios.py'
      - '.github/workflows/sitio.yml'
permissions:
  contents: write
concurrency:
  group: sitio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sitio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fotos nuevas
        run: python herramientas/fotos.py descargar
      - name: Fichas de equipos
        run: python herramientas/fichas.py
      - name: Rutas para la actualización de precios
        run: python herramientas/precios.py rutas
      - name: Guardar en el repositorio
        run: |
          git config user.name "sitio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/p assets/og assets/fotos.js assets/fichas.js assets/portada.json herramientas/fotos-log.txt herramientas/fichas.json herramientas/rutas.json notebook celular tablet televisor sitemap.xml
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Fotos y fichas actualizadas (automático)"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
