# Tareas automáticas de ¿Cuál me conviene? cada vez que cambian los precios o la lista de fotos:
# 1) baja y optimiza las fotos nuevas (assets/p/<id>.webp)
# 2) rehace la ficha de cada equipo con su historial de precios, las guías (guia/), el sitemap y assets/fichas.js
# Guarda el resultado en la misma rama y Cloudflare lo publica solo.
name: Fotos y fichas
on:
  workflow_dispatch:
  schedule:
    # De noche y de madrugada (de día lo lanza cada vuelta de precios, cada 2 horas): un cupón vencido no debe seguir como
    # precio principal en fichas y guías. Menos vueltas = menos despliegues de Cloudflare (el plan gratis da 500 al mes).
    - cron: '17 3,6,9 * * *'   # 0:17, 3:17 y 6:17 de Chile (verano)
  push:
    paths:
      - 'notebooks.html'
      - 'celulares.html'
      - 'tablets.html'
      - 'televisores.html'
      - 'consolas.html'
      - 'lavadoras.html'
      - 'aspiradoras.html'
      - 'batidoras.html'
      - 'cafeteras.html'
      - 'freidoras-de-aire.html'
      - 'aires-acondicionados.html'
      - 'cocinas-y-encimeras.html'
      - 'hornos-y-microondas.html'
      - 'colchones.html'
      - 'herramientas/fotos.json'
      - 'herramientas/fotos.py'
      - 'herramientas/fichas.py'
      - 'herramientas/precios.py'
      - 'herramientas/versiones.py'
      - '.github/workflows/sitio.yml'
permissions:
  contents: write
  actions: write   # para lanzar "Avisos de precio" al terminar
concurrency:
  group: sitio-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sitio:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Fotos nuevas
        run: python herramientas/fotos.py descargar
      - name: Fichas de equipos
        run: python herramientas/fichas.py
      - name: Rutas para la actualización de precios
        run: python herramientas/precios.py rutas
      - name: Versión de los archivos compartidos (evita fotos viejas en caché)
        run: python herramientas/versiones.py
      - name: Guardar en el repositorio
        run: |
          git config user.name "sitio-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add *.html assets/p assets/og assets/fotos.js assets/fichas.js assets/oficiales.js assets/portada.json assets/avisos.json herramientas/fotos-log.txt herramientas/fichas.json herramientas/rutas.json herramientas/nombres.json notebook celular tablet televisor consola lavadora aspiradora batidora cafetera freidora aire-acondicionado cocina horno colchon guia sitemap.xml llms.txt
          if git diff --cached --quiet; then
            # Los precios se guardan con [CF-Pages-Skip]: si las fichas no cambiaron, igual hay que publicar una vez
            if git log -1 --format=%s | grep -q 'CF-Pages-Skip'; then git commit -q --allow-empty -m "Publicar precios (automático)"; else echo "Sin cambios"; exit 0; fi
          else
            git commit -m "Fotos y fichas actualizadas (automático)"
          fi
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0; sleep 5; done
          exit 1
      - name: Lanzar los avisos por correo (el resumen diario sale desde las 10:00)
        if: github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run avisos.yml --ref main -f esperar=true
